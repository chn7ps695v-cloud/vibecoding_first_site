<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Трекер недовольств Елены</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", sans-serif; display: flex;
           min-height: 100vh; margin: 0; padding: 5vw 4vw 5vw 71vw; box-sizing: border-box;
           align-items: center; justify-content: center;
           background: #a8a29e; color: #164e63; }
    body::before { content: ""; position: fixed; inset: 0 auto 0 0; width: 68%;
                   background: url("assets/monkey.jpg") center / cover no-repeat; }
    main { position: relative; z-index: 1; text-align: center; padding: 2rem;
           background: rgba(255, 255, 255, .38); border: 1px solid rgba(255, 255, 255, .65);
           border-radius: 1.5rem; box-shadow: 0 1rem 3rem rgba(8, 47, 73, .2);
           backdrop-filter: blur(1rem); }
    h1 { font-size: 2rem; margin-bottom: .5rem; }
    p  { color: #475569; }
    .drop { font-size: 3rem; margin-bottom: .5rem; }
    .buttons { display: flex; gap: .75rem; justify-content: center; }
    button { font-size: 1.25rem; min-width: 3.5rem; padding: .65rem 1rem; border: none;
             border-radius: .75rem; background: #0284c7; color: #fff; cursor: pointer; }
    button.secondary { background: #fef3c7; color: #92400e; }
    button:active { transform: scale(.97); }
    #count { font-size: 3rem; margin: 1rem 0; }
    @media (max-width: 600px) {
      body { padding: 1rem; align-items: flex-end; justify-content: center; }
      body::before { width: 100%; height: 58%; background-position: center; }
      main { width: 100%; padding: 1.25rem; box-sizing: border-box; }
    }
  </style>
</head>
<body>
  <main>
    <div class="drop" aria-hidden="true">😒</div>
    <h1>Трекер недовольств Елены</h1>
    <p>Сколько раз Елена была недовольна сегодня?</p>
    <div id="count">0</div>
    <div class="buttons">
      <button onclick="decrease()" aria-label="Убрать одно недовольство">−</button>
      <button onclick="increase()" aria-label="Добавить одно недовольство">+</button>
      <button class="secondary" onclick="reset()" aria-label="Начать день заново">↺</button>
    </div>
    <script>
      const storageKey = 'elena-complaints';
      const savedCount = Number(localStorage.getItem(storageKey));
      let count = Number.isFinite(savedCount) && savedCount >= 0 ? savedCount : 0;
      const counter = document.getElementById('count');

      function showCount() {
        counter.textContent = count;
        localStorage.setItem(storageKey, count);
      }

      function increase() {
        count++;
        showCount();
      }

      function decrease() {
        if (count > 0) count--;
        showCount();
      }

      function reset() {
        count = 0;
        showCount();
      }

      showCount();
    </script>
  </main>
</body>
</html>
