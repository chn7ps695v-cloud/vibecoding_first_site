<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мой первый сайт</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", sans-serif; display: flex;
           min-height: 100vh; margin: 0; align-items: center; justify-content: center;
           background: #f5f6fa; color: #222; }
    main { text-align: center; padding: 2rem; background: #fff; border-radius: 1.5rem;
           box-shadow: 0 1rem 3rem rgba(15, 23, 42, .1); }
    h1 { font-size: 2rem; margin-bottom: .5rem; }
    p  { color: #555; }
    .buttons { display: flex; gap: .75rem; justify-content: center; }
    button { font-size: 1.25rem; min-width: 3.5rem; padding: .65rem 1rem; border: none;
             border-radius: .75rem; background: #2563eb; color: #fff; cursor: pointer; }
    button.secondary { background: #e2e8f0; color: #334155; }
    button:active { transform: scale(.97); }
    #count { font-size: 3rem; margin: 1rem 0; }
  </style>
</head>
<body>
  <main>
    <h1>Мой первый сайт</h1>
    <p>Ты нажал на кнопку столько раз:</p>
    <div id="count">0</div>
    <div class="buttons">
      <button onclick="decrease()" aria-label="Уменьшить счётчик">−</button>
      <button onclick="increase()" aria-label="Увеличить счётчик">+</button>
      <button class="secondary" onclick="reset()" aria-label="Сбросить счётчик">↺</button>
    </div>
    <script>
      const savedCount = Number(localStorage.getItem('counter'));
      let count = Number.isFinite(savedCount) && savedCount >= 0 ? savedCount : 0;
      const counter = document.getElementById('count');

      function showCount() {
        counter.textContent = count;
        localStorage.setItem('counter', count);
      }

      function increase() {
        count++;
        showCount();
      }

      function decrease() {
        if (count > 0) count--;
        showCount();
      }

      function reset() {
        count = 0;
        showCount();
      }

      showCount();
    </script>
  </main>
</body>
</html>
